name: Reconcile Clara infrastructure

on:
  push:
    branches: [main]
    paths:
      - bootstrap.sh
      - infrastructure/desired-state.json
      - scripts/configure-swap.sh
      - scripts/reconcile-network.sh
      - scripts/reconcile-host.sh
      - etc/fail2ban/jail.d/00-clara.conf
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clara-infrastructure
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Prepare isolated Azure configuration
        run: |
          azure_config_dir="$RUNNER_TEMP/azure-clara-bootstrap"
          rm -rf "$azure_config_dir"
          install -d -m 0700 "$azure_config_dir"
          printf 'AZURE_CONFIG_DIR=%s\n' "$azure_config_dir" >> "$GITHUB_ENV"

      - name: Prepare dedicated Clara SSH identity
        env:
          CLARA_SSH_PRIVATE_KEY: ${{ secrets.CLARA_SSH_PRIVATE_KEY }}
        run: |
          ssh_key="$RUNNER_TEMP/clara-bootstrap-actions-key"
          install -m 0600 /dev/null "$ssh_key"
          printf '%s\n' "$CLARA_SSH_PRIVATE_KEY" > "$ssh_key"
          ssh-keygen -y -f "$ssh_key" > "$ssh_key.pub"
          expected=$(ssh-keygen -lf keys/clara-bootstrap-actions.pub | awk '{ print $2 }')
          actual=$(ssh-keygen -lf "$ssh_key.pub" | awk '{ print $2 }')
          [[ $actual == "$expected" ]]
          printf 'CLARA_SSH_KEY=%s\n' "$ssh_key" >> "$GITHUB_ENV"

      - name: Validate desired state
        run: |
          jq -e '
            .azure.resourceGroup == "RG-CLARA" and
            .azure.vmName == "clara" and
            .azure.vmSize == "Standard_B2ms" and
            (.azure.networkSecurityGroup | length > 0) and
            (.azure.networkReconciler.principalObjectId | test("^[0-9a-f-]{36}$")) and
            .azure.networkReconciler.role == "Network Contributor" and
            (.azure.inboundRules | length > 0) and
            ([.azure.inboundRules[].name] | unique | length) == (.azure.inboundRules | length) and
            ([.azure.inboundRules[].destinationPorts[] | select(. == "22" or . == "80" or . == "443")] | length) == 0 and
            (.host.deploymentSshHost | endswith(".ts.net")) and
            (.host.maskedSystemdUnits | type == "array") and
            (all(.host.maskedSystemdUnits[]; test("^[A-Za-z0-9_.@-]+\\.(service|socket|timer|path|target)$"))) and
            (.host.maskedSystemdUnits | unique | length) == (.host.maskedSystemdUnits | length) and
            .host.rebootWhenRequired == true and
            (.host.swapFile | startswith("/")) and
            (.host.swapSizeGiB | type == "number" and . > 0) and
            (.host.swappiness | type == "number" and . >= 0 and . <= 100)
          ' infrastructure/desired-state.json >/dev/null
          bash -n scripts/configure-swap.sh scripts/reconcile-host.sh scripts/reconcile-network.sh

      - name: Install Azure CLI
        run: |
          if ! command -v az >/dev/null; then
            curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
          fi
          az version --output json >/dev/null

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Reconcile Azure VM size
        id: vm
        run: |
          resource_group=$(jq -r '.azure.resourceGroup' infrastructure/desired-state.json)
          vm_name=$(jq -r '.azure.vmName' infrastructure/desired-state.json)
          target_size=$(jq -r '.azure.vmSize' infrastructure/desired-state.json)
          current_size=$(az vm show \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --query hardwareProfile.vmSize \
            --output tsv)

          if [[ $current_size != "$target_size" ]]; then
            printf 'Resizing %s from %s to %s\n' "$vm_name" "$current_size" "$target_size"
            az vm deallocate --resource-group "$resource_group" --name "$vm_name"
            az vm resize \
              --resource-group "$resource_group" \
              --name "$vm_name" \
              --size "$target_size"
            az vm start --resource-group "$resource_group" --name "$vm_name"
          fi

          actual_size=$(az vm show \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --query hardwareProfile.vmSize \
            --output tsv)
          [[ $actual_size == "$target_size" ]]

          public_ip=$(az vm show \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --show-details \
            --query publicIps \
            --output tsv)
          [[ -n $public_ip ]]
          printf 'public_ip=%s\n' "$public_ip" >> "$GITHUB_OUTPUT"

      - name: Wait for Clara SSH
        run: |
          ssh_host=$(jq -r '.host.deploymentSshHost' infrastructure/desired-state.json)
          for attempt in $(seq 1 60); do
            if ssh \
              -o HostName="$ssh_host" \
              -o IdentitiesOnly=yes \
              -i "$CLARA_SSH_KEY" \
              -o BatchMode=yes \
              -o ConnectTimeout=5 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              clara true; then
              exit 0
            fi
            printf 'SSH wait %s/60\n' "$attempt"
            sleep 10
          done
          exit 1

      - name: Reconcile Clara host
        run: |
          ssh_host=$(jq -r '.host.deploymentSshHost' infrastructure/desired-state.json)
          swap_file=$(jq -r '.host.swapFile' infrastructure/desired-state.json)
          swap_size_gib=$(jq -r '.host.swapSizeGiB' infrastructure/desired-state.json)
          swappiness=$(jq -r '.host.swappiness' infrastructure/desired-state.json)
          masked_systemd_units=$(jq -c '.host.maskedSystemdUnits' infrastructure/desired-state.json)
          ssh \
            -o HostName="$ssh_host" \
            -o IdentitiesOnly=yes \
            -i "$CLARA_SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            clara \
            "sudo CLARA_SWAP_FILE='$swap_file' CLARA_SWAP_SIZE_GIB='$swap_size_gib' CLARA_SWAPPINESS='$swappiness' bash -s" \
            < scripts/configure-swap.sh
          ssh \
            -o HostName="$ssh_host" \
            -o IdentitiesOnly=yes \
            -i "$CLARA_SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            clara 'cat | sudo tee /tmp/00-clara.conf >/dev/null' \
            < etc/fail2ban/jail.d/00-clara.conf
          ssh \
            -o HostName="$ssh_host" \
            -o IdentitiesOnly=yes \
            -i "$CLARA_SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            clara "sudo CLARA_MASKED_SYSTEMD_UNITS='$masked_systemd_units' bash -s" \
            < scripts/reconcile-host.sh

      - name: Reconcile runner Clara SSH alias
        run: |
          ssh_host=$(jq -r '.host.deploymentSshHost' infrastructure/desired-state.json)
          sed -i "/^Host clara$/,/^Host / s/^  HostName .*/  HostName $ssh_host/" ~/.ssh/config
          [[ $(ssh -G clara | awk '$1 == "hostname" { print $2; exit }') == "$ssh_host" ]]
          ssh -o BatchMode=yes -o ConnectTimeout=5 clara true

      - name: Reconcile Azure network policy
        run: scripts/reconcile-network.sh infrastructure/desired-state.json

      - name: Reboot Clara when required
        run: |
          ssh_host=$(jq -r '.host.deploymentSshHost' infrastructure/desired-state.json)
          reboot_when_required=$(jq -r '.host.rebootWhenRequired' infrastructure/desired-state.json)
          if [[ $reboot_when_required == true ]] && ssh \
            -o HostName="$ssh_host" \
            -o IdentitiesOnly=yes \
            -i "$CLARA_SSH_KEY" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            clara test -f /var/run/reboot-required; then
            ssh \
              -o HostName="$ssh_host" \
              -o IdentitiesOnly=yes \
              -i "$CLARA_SSH_KEY" \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              clara sudo systemctl reboot || true

            for attempt in $(seq 1 30); do
              if ! ssh \
                -o HostName="$ssh_host" \
                -o IdentitiesOnly=yes \
                -i "$CLARA_SSH_KEY" \
                -o BatchMode=yes \
                -o ConnectTimeout=3 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                clara true 2>/dev/null; then
                break
              fi
              sleep 2
            done

            for attempt in $(seq 1 60); do
              if ssh \
                -o HostName="$ssh_host" \
                -o IdentitiesOnly=yes \
                -i "$CLARA_SSH_KEY" \
                -o BatchMode=yes \
                -o ConnectTimeout=5 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                clara true; then
                break
              fi
              [[ $attempt == 60 ]] && exit 1
              sleep 5
            done
          fi

      - name: Verify desired state
        env:
          PUBLIC_IP: ${{ steps.vm.outputs.public_ip }}
        run: |
          resource_group=$(jq -r '.azure.resourceGroup' infrastructure/desired-state.json)
          vm_name=$(jq -r '.azure.vmName' infrastructure/desired-state.json)
          target_size=$(jq -r '.azure.vmSize' infrastructure/desired-state.json)
          swap_file=$(jq -r '.host.swapFile' infrastructure/desired-state.json)
          swap_size_gib=$(jq -r '.host.swapSizeGiB' infrastructure/desired-state.json)
          swappiness=$(jq -r '.host.swappiness' infrastructure/desired-state.json)
          ssh_host=$(jq -r '.host.deploymentSshHost' infrastructure/desired-state.json)

          actual_size=$(az vm show \
            --resource-group "$resource_group" \
            --name "$vm_name" \
            --query hardwareProfile.vmSize \
            --output tsv)
          [[ $actual_size == "$target_size" ]]

          ssh \
            -o HostName="$ssh_host" \
            -o IdentitiesOnly=yes \
            -i "$CLARA_SSH_KEY" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            clara \
            "sudo test \"\$(stat -c %s '$swap_file')\" -eq $((swap_size_gib * 1024 * 1024 * 1024)) && sudo swapon --noheadings --raw --show=NAME | grep -Fxq '$swap_file' && test \"\$(sysctl -n vm.swappiness)\" -eq '$swappiness' && test ! -f /var/run/reboot-required"

          for port in 22 80 443; do
            if timeout 5 bash -c "</dev/tcp/$PUBLIC_IP/$port" 2>/dev/null; then
              echo "Public TCP port remains reachable: $port" >&2
              exit 1
            fi
          done

      - name: Log out of Azure
        if: always()
        run: |
          az logout || true
          rm -rf "$AZURE_CONFIG_DIR"
          rm -f "${CLARA_SSH_KEY:-}" "${CLARA_SSH_KEY:-}.pub"
