# clara-specific fail2ban tuning. Placed in /etc/fail2ban/jail.d/ so it
# overrides the apt-shipped defaults-debian.conf without editing that file.
# Bantime and findtime are already sane global defaults; jails match the
# nginx setup on this host.

[DEFAULT]
bantime  = 1h
findtime = 10m
maxretry = 5

[sshd]
enabled = true
mode = aggressive
backend = systemd
journalmatch = _SYSTEMD_UNIT=ssh.service + _COMM=sshd

[nginx-http-auth]
enabled = true
backend = polling
logpath = /var/log/nginx/error.log

[nginx-botsearch]
enabled = true
backend = polling
logpath = /var/log/nginx/access.log

[nginx-limit-req]
enabled = true
backend = polling
logpath = /var/log/nginx/error.log
